spring.application.name=kinga-api
server.port=8085

# In-memory database: fresh demo data on every start.
# Switch to jdbc:h2:file:./data/kinga to keep data between restarts.
spring.datasource.url=jdbc:h2:mem:kinga;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Monitoring
kinga.check.default-interval-seconds=60
kinga.check.timeout-ms=8000
kinga.check.tick-ms=5000
# Base URL the monitors use to reach the built-in mock provider APIs
kinga.mock.base-url=http://localhost:8085/mock
# Provider-wide incident: at least this many monitors, and this share of them failing
kinga.community.min-monitors=3
kinga.community.failure-ratio=0.5
kinga.community.window-minutes=5

kinga.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*

# Send validation messages to the frontend
server.error.include-message=always
server.error.include-binding-errors=always
